name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Placeholder checks
        run: |
          echo "Host vertical slice not implemented yet."
          echo "This workflow will run schema/TS/Python checks once src/host is populated."
