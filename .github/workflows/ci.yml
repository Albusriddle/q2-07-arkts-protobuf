name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/host/ts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++
      - name: Host gate (codegen + negative + sample + build + fake NAPI)
        run: bash scripts/ci_host.sh
      - name: ASan/UBSan host tests
        run: |
          bash scripts/build_host_asan.sh
          ./build/host/host_tests_asan.exe
      - name: Upload host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-logs
          path: |
            build/host/logs/
            evidence/host_slice.json
            evidence/v0_4_decoder.json
          if-no-files-found: ignore
